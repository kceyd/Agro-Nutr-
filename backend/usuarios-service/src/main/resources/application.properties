server.port=${SERVER_PORT:8082}

# Cada microservicio tiene SU PROPIA base de datos y SU PROPIO usuario de MySQL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nutri_usuarios?serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:nutri_usuarios}
spring.datasource.password=${DB_PASSWORD:usuarios_pass}

# update conserva los datos entre reinicios (create-drop los borraba al apagar).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.application.name=usuarios-service
springdoc.swagger-ui.path=/swagger-ui.html
